name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run test:integration

  webdav-compat:
    name: WebDAV compatibility (Apache mod_dav)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Start Apache httpd with mod_dav
        run: scripts/webdav/run.sh
      - name: Storage conformance against Apache
        env:
          RIDEO_TEST_WEBDAV_URL: http://rideo:rideo@localhost:8080/
        run: npx vitest run --project server-integration packages/server/test/integration/storage.test.ts

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The real-model suite (docs/testing.md#real-models-e2ereal): a real mm-gateway and real providers, so real costs.
  # Pushes to main and manual runs only; pull requests never get it (and forks get no secrets).
  real-ai-check:
    name: Real models configured?
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          IMAGE_MODEL_TYPE: ${{ vars.IMAGE_MODEL_TYPE }}
          IMAGE_MODEL_BASE_URL: ${{ vars.IMAGE_MODEL_BASE_URL }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
          IMAGE_MODEL_API_KEY: ${{ secrets.IMAGE_MODEL_API_KEY }}
          VIDEO_GEN_MODEL_TYPE: ${{ vars.VIDEO_GEN_MODEL_TYPE }}
          VIDEO_GEN_BASE_URL: ${{ vars.VIDEO_GEN_BASE_URL }}
          VIDEO_GEN_MODEL: ${{ vars.VIDEO_GEN_MODEL }}
          VIDEO_GEN_API_KEY: ${{ secrets.VIDEO_GEN_API_KEY }}
          VISION_MODEL_TYPE: ${{ vars.VISION_MODEL_TYPE }}
          VISION_MODEL_BASE_URL: ${{ vars.VISION_MODEL_BASE_URL }}
          VISION_MODEL: ${{ vars.VISION_MODEL }}
          VISION_MODEL_API_KEY: ${{ secrets.VISION_MODEL_API_KEY }}
        run: |
          missing=()
          for v in IMAGE_MODEL_TYPE IMAGE_MODEL_BASE_URL IMAGE_MODEL IMAGE_MODEL_API_KEY \
            VIDEO_GEN_MODEL_TYPE VIDEO_GEN_BASE_URL VIDEO_GEN_MODEL VIDEO_GEN_API_KEY \
            VISION_MODEL_TYPE VISION_MODEL_BASE_URL VISION_MODEL VISION_MODEL_API_KEY; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice title=Real-model suite skipped::not set: ${missing[*]} (docs/testing.md#real-models-e2ereal)"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  real-ai:
    name: End-to-end on real models
    runs-on: ubuntu-24.04
    needs: real-ai-check
    if: needs.real-ai-check.outputs.configured == 'true'
    timeout-minutes: 60
    env:
      IMAGE_MODEL_TYPE: ${{ vars.IMAGE_MODEL_TYPE }}
      IMAGE_MODEL_BASE_URL: ${{ vars.IMAGE_MODEL_BASE_URL }}
      IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
      VIDEO_GEN_MODEL_TYPE: ${{ vars.VIDEO_GEN_MODEL_TYPE }}
      VIDEO_GEN_BASE_URL: ${{ vars.VIDEO_GEN_BASE_URL }}
      VIDEO_GEN_MODEL: ${{ vars.VIDEO_GEN_MODEL }}
      VIDEO_GEN_DURATION_SEC: ${{ vars.VIDEO_GEN_DURATION_SEC }}
      VISION_MODEL_TYPE: ${{ vars.VISION_MODEL_TYPE }}
      VISION_MODEL_BASE_URL: ${{ vars.VISION_MODEL_BASE_URL }}
      VISION_MODEL: ${{ vars.VISION_MODEL }}
      MM_GATEWAY_IMAGE: ${{ vars.MM_GATEWAY_IMAGE }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run build -w @rideo/web
      # The keys reach this step only: the stack hands them to the gateway container's environment.
      - name: Real-model suite
        env:
          IMAGE_MODEL_API_KEY: ${{ secrets.IMAGE_MODEL_API_KEY }}
          VIDEO_GEN_API_KEY: ${{ secrets.VIDEO_GEN_API_KEY }}
          VISION_MODEL_API_KEY: ${{ secrets.VISION_MODEL_API_KEY }}
        run: npx playwright test -c playwright.real.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-ai
          path: |
            playwright-report-real/
            test-results/real/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    needs: [lint, unit, integration]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
