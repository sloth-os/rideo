# Fully offline demo: Rideo with the mock mm-gateway (deterministic images, video, music and LLM) and the
# 3D-Editor's director's desk.
#   docker compose -f docker-compose.demo.yml up  →  http://localhost:8787 (the desk loads from http://127.0.0.1:8788)
services:
  rideo:
    image: ghcr.io/sloth-os/rideo:latest
    build: .
    environment:
      MM_GATEWAY_URL: http://mock-gateway:8790
      RIDEO_LLM_PROVIDER: openai
      RIDEO_LLM_PROXY_DOMAIN: api.openai.com
      RIDEO_GATEWAY_POLL_MS: "500"
      # Character voices through the mock's ElevenLabs endpoints (docs/design/dialogue.md).
      RIDEO_TTS_PROVIDER: elevenlabs
      # Sound effects through the mock's ElevenLabs sound generation (docs/design/post-audio.md).
      RIDEO_SFX_PROVIDER: elevenlabs
      # The desk page the Storyboard view embeds: the 3d-editor service below (docs/deployment.md#the-directors-desk).
      RIDEO_DESK_URL: ${RIDEO_DESK_URL-http://127.0.0.1:8788/desk.html}
    ports:
      - "8787:8787"
    volumes:
      - rideo-demo-data:/data
    depends_on:
      - mock-gateway

  mock-gateway:
    image: ghcr.io/sloth-os/rideo:latest
    build: .
    command: ["node", "packages/mock-gateway/dist/main.js"]
    environment:
      MOCK_GATEWAY_HOST: 0.0.0.0
      MOCK_GATEWAY_PORT: "8790"
    expose:
      - "8790"
    healthcheck:
      disable: true

  # The 3D-Editor, serving its director's desk: browsers load it, rideo's server never calls it.
  3d-editor:
    image: ${DESK_IMAGE:-ghcr.io/sloth-os/3d-editor:latest}
    environment:
      # The origins that may frame the desk (its frame-ancestors): the studio as browsers open it
      DESK_EMBED_ORIGINS: ${DESK_EMBED_ORIGINS:-http://localhost:8787}
      # The desk calls no server: the 3D-Editor's MCP endpoint stays off unless asked for, and a token (set one on a
      # server) closes its API, sync and WebDAV, which the desk page does not need
      MCP_ENABLED: ${DESK_MCP_ENABLED:-false}
      AUTH_TOKEN: ${DESK_AUTH_TOKEN-}
    ports:
      - "127.0.0.1:8788:8080"
    volumes:
      - 3d-editor-demo-data:/data
    # a network of its own: it reaches neither the studio nor the gateway, which it never needs
    networks:
      - desk

volumes:
  rideo-demo-data:
  3d-editor-demo-data:

networks:
  desk:
