# Rideo under https://example.com/rideo/ (docs/design/subpath.md), Apache httpd 2.4.47 or later.
# Needs mod_proxy, mod_proxy_http, mod_headers and mod_rewrite. Include in a <VirtualHost>.
# Set RIDEO_PUBLIC_URL=https://example.com/rideo on Rideo so links that leave the browser carry the subpath.

RewriteEngine On
# the bare prefix goes to the studio's page
RewriteRule ^/rideo$ /rideo/ [R=308,L]

ProxyPreserveHost On
# Rideo learns where it lives from the proxy
RequestHeader set X-Forwarded-Prefix "/rideo"
RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

# the trailing slashes strip /rideo; upgrade=websocket carries the live channel
ProxyPass        /rideo/ http://127.0.0.1:8787/ upgrade=websocket flushpackets=on timeout=3600
ProxyPassReverse /rideo/ http://127.0.0.1:8787/
