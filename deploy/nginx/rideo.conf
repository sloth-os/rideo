# Rideo under https://example.com/rideo/ (docs/design/subpath.md). Include in a server { } block.
# Set RIDEO_PUBLIC_URL=https://example.com/rideo on Rideo so links that leave the browser carry the subpath.

# (in the http { } block) WebSocket upgrades for the live channel and MCP streams
# map $http_upgrade $connection_upgrade { default upgrade; '' close; }

location = /rideo { return 308 /rideo/; }

location /rideo/ {
    # the trailing slash strips /rideo; X-Forwarded-Prefix tells Rideo where it lives
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /rideo;
    # media ranges, uploads of any size, long renders
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 0;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}
